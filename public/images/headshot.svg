<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Formal portrait silhouette with clean light-gray background">
  <!-- Subtle neutral background -->
  <rect width="400" height="400" rx="16" fill="#F3F4F6" />
  
  <!-- Subtle inner boundary border -->
  <rect x="0.5" y="0.5" width="399" height="399" rx="15.5" stroke="#E5E7EB" />

  <!-- Soft gradient background glow -->
  <circle cx="200" cy="180" r="140" fill="#EAEBEF" />

  <!-- Portrait Silhouette -->
  <g fill="#9CA3AF" opacity="0.85">
    <!-- Head / Face -->
    <ellipse cx="200" cy="150" rx="58" ry="72" />
    
    <!-- Hairline detail -->
    <path d="M142 145 C142 95, 170 76, 200 76 C230 76, 258 95, 258 145 C250 115, 230 92, 200 92 C170 92, 150 115, 142 145 Z" fill="#6B7280" />

    <!-- Neck -->
    <path d="M182 210 L182 250 C182 256, 186 262, 200 262 C214 262, 218 256, 218 250 L218 210 Z" fill="#9CA3AF" />

    <!-- Shoulders & Torso -->
    <path d="M96 380 C96 305, 140 265, 178 254 L178 275 L200 295 L222 275 L222 254 C260 265, 304 305, 304 380 Z" fill="#4B5563" />

    <!-- Formal Shirt Collar -->
    <path d="M178 254 L200 292 L188 290 L174 264 Z" fill="#F9FAFB" />
    <path d="M222 254 L200 292 L212 290 L226 264 Z" fill="#F9FAFB" />
    <polygon points="195,290 205,290 203,380 197,380" fill="#374151" opacity="0.4" />
  </g>

  <!-- Monogram Watermark / Developer Badge -->
  <rect x="24" y="24" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" />
  <text x="42" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#374151" letter-spacing="-0.5">AH</text>
</svg>
